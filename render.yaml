services:
  - type: web
    name: procuraflow-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/procuraflow.db
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: LICENSED_COMPANY_NAME
        sync: false
      - key: LICENSED_HOSTNAMES
        sync: false
    disk:
      name: procuraflow-data
      mountPath: /var/data
      sizeGB: 1
